<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Test import photooooooooooos</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>📸 Ma garde-robe</h1>

    <button id="importButton">
        📥 Importer mes photos
    </button>

    <input
        type="file"
        id="photoInput"
        accept="image/*"
        multiple
        style="display: none;"
    >

    <p id="count">Aucune photo importée</p>

    <div id="gallery"></div>

    <script src="script.js"></script>

    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("./sw.js");
        }
    </script>

</body>
</html>
